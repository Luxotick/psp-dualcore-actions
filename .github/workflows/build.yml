name: Build PSP EBOOT

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:v20261001
    steps:
      - name: Install build host helpers
        run: apk add --no-cache python3
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build pinned dependencies, EBOOT and verify binaries
        shell: bash
        run: python3 scripts/build.py
      - name: Upload PSP game package and debugging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PSP-ME-Two-Operands
          path: dist/
          if-no-files-found: error
